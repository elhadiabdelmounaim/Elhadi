
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Mon Portfolio</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <header>
        <h1>Elhadi Abdelmounaim</h1>
        <p>Développeur Django | Professeur de Mathématiques</p>
    </header>

    <section class="projects">
        <h2>Mes Projets</h2>

        <div class="project-container">
            {% for project in projects %}
                <div class="card">
                    <img src="{{ project.image.url }}" alt="">
                    <h3>{{ project.title }}</h3>
                    <p>{{ project.description }}</p>
                </div>
            {% endfor %}
        </div>

    </section>

</body>
</html>
